name: lncRNA_orthology_workflow

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core languages
  - r-base>=4.0
  - perl>=5.32

  # R packages
  - bioconductor-biomart>=2.38
  - r-stringr>=1.5.0
  - r-stringi>=1.8
  - r-pbapply>=1.7
  - r-tidyr>=1.3.1
  - r-dplyr>=1.1.4

  # Perl / bioinformatics dependencies
  - perl-bioperl>=1.7.8

  # Useful command-line tools
  - wget
  - git